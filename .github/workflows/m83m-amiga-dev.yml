name: M8.3m amiga-dev qualification

on:
  push:
    branches: [m8.3m-post-retirement-qualification]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  AMIGA_DEV_IMAGE: ghcr.io/ploos-as/amiga-dev:edge
  ACE_REPOSITORY: https://github.com/AmigaPorts/ACE.git
  ACE_REVISION: dc0674c2d2cf328386574b9ac71bbe6747db470e

jobs:
  amiga-dev-q1:
    name: amiga-dev Q1 mechanical qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull qualified amiga-dev image
        run: docker pull "$AMIGA_DEV_IMAGE"

      - name: Run pinned ACE/Bebbo qualification
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            -e ACE_REPOSITORY \
            -e ACE_REVISION \
            "$AMIGA_DEV_IMAGE" \
            sh -ec '
              amiga-check
              amiga-toolchain-info
              git clone "$ACE_REPOSITORY" /tmp/ace
              git -C /tmp/ace checkout --detach "$ACE_REVISION"
              test "$(git -C /tmp/ace rev-parse HEAD)" = "$ACE_REVISION"
              test -z "$(git -C /tmp/ace status --porcelain --untracked-files=normal)"
              python3 -m venv /tmp/g2a-venv
              /tmp/g2a-venv/bin/pip install --disable-pip-version-check /workspace
              TOOLCHAIN_FILE="$(find /opt/amiga -type f -name m68k-amigaos.cmake -print -quit)"
              test -n "$TOOLCHAIN_FILE"
              G2A_ACE_ROOT=/tmp/ace \
              G2A_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
              G2A_TOOLCHAIN_PATH=/opt/amiga \
                /tmp/g2a-venv/bin/python /workspace/scripts/qualify-m82-runtime.py \
                  --no-launch --jobs "$(nproc)" \
                  --work-directory /tmp/g2a-m83m-q1
              mkdir -p /tmp/g2a-evidence
              cp -a /tmp/g2a-m83m-q1/fs-uae-runtime/. /tmp/g2a-evidence/
              amiga-inspect /tmp/g2a-m83m-q1/fs-uae-runtime/Test/Godot2Amiga \
                > /tmp/g2a-evidence/amiga-inspect.txt
              amiga-toolchain-info > /tmp/g2a-evidence/amiga-toolchain-info.txt
              printf "%s\n" "$ACE_REVISION" > /tmp/g2a-evidence/ace-revision.txt
              cp -a /tmp/g2a-evidence /tmp/export-evidence
            '

      - name: Export qualification evidence
        run: |
          id="$(docker create "$AMIGA_DEV_IMAGE")"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          # The qualification container is intentionally ephemeral; rerun a
          # packaging-only container with a writable host mount for evidence.
          mkdir -p m83m-q1-evidence
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/m83m-q1-evidence:/evidence" \
            -w /workspace \
            -e ACE_REPOSITORY \
            -e ACE_REVISION \
            "$AMIGA_DEV_IMAGE" \
            sh -ec '
              amiga-check > /evidence/amiga-check.txt
              amiga-toolchain-info > /evidence/amiga-toolchain-info.txt
              printf "%s\n" "$ACE_REVISION" > /evidence/ace-revision.txt
            '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m83m-amiga-dev-q1-evidence
          path: m83m-q1-evidence/
          if-no-files-found: error
